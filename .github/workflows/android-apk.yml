name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Checks and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Export Android JavaScript bundle
        run: pnpm exec expo export --platform android --output-dir /tmp/figural-android-bundle

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Assemble debug and release APKs
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d4me-android-apks-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
